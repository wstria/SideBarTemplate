<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>SideBarTemplate</title>
    <link rel="icon" href="./favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <svg class="icon-sprite" aria-hidden="true">
      <symbol id="icon-panel-left" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="16" rx="2"></rect>
        <path d="M9 4v16"></path>
      </symbol>
      <symbol id="icon-plus" viewBox="0 0 24 24">
        <path d="M12 5v14"></path>
        <path d="M5 12h14"></path>
      </symbol>
      <symbol id="icon-close" viewBox="0 0 24 24">
        <path d="M6.5 6.5l11 11"></path>
        <path d="M17.5 6.5l-11 11"></path>
      </symbol>
      <symbol id="icon-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="m20 20-3.6-3.6"></path>
      </symbol>
      <symbol id="icon-gear" viewBox="0 0 24 24">
        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </symbol>
    </svg>

    <div id="shell" class="shell">
      <header class="topbar">
        <div class="topbar-gutter" aria-hidden="true"></div>

        <nav class="tabstrip" aria-label="Open tabs">
          <div id="tablist" class="tablist" role="tablist"></div>
          <button id="new-tab" class="new-tab" type="button" aria-label="New tab" title="New tab">
            <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-plus"></use></svg>
          </button>
        </nav>
      </header>

      <div class="body">
        <div class="rail">
          <button id="sidebar-toggle" class="icon-button" type="button" aria-label="Toggle sidebar" title="Toggle sidebar" aria-expanded="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-panel-left"></use></svg>
          </button>
          <button id="settings-open" class="icon-button rail-bottom" type="button" aria-label="Settings" title="Settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-gear"></use></svg>
          </button>
        </div>
        <aside id="sidebar" class="sidebar" aria-label="Sidebar">
          <div class="sidebar-head">
            <div class="search">
              <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-search"></use></svg>
              <input id="sidebar-search" class="search-input" type="search" placeholder="Search" aria-label="Search sidebar" autocomplete="off" spellcheck="false">
            </div>
          </div>
          <nav id="sidebar-nav" class="sidebar-nav" aria-label="Settings sections" hidden></nav>
        </aside>
        <main id="stage" class="stage" aria-label="Content">
          <section id="settings" class="settings" aria-label="Settings" hidden>
            <div class="settings-inner">
              <section class="setting-group" data-section="themes">
                <h1 class="setting-title">Themes</h1>
                <p class="setting-note">Pick a base look. Each preset recolors the whole app.</p>
                <div id="preset-grid" class="preset-grid"></div>
              </section>

              <section class="setting-group" data-section="colors" hidden>
                <h1 class="setting-title">Colors</h1>
                <p class="setting-note">Fine-tune the accent used across controls and highlights.</p>
                <div class="setting-row">
                  <label for="opt-accent">Accent color</label>
                  <input id="opt-accent" type="color">
                </div>
              </section>

              <section class="setting-group" data-section="typography" hidden>
                <h1 class="setting-title">Typography</h1>
                <p class="setting-note">Set the typeface and base size for the interface.</p>
                <div class="setting-row">
                  <label for="opt-font">Font family</label>
                  <select id="opt-font">
                    <option value="inter">Inter</option>
                    <option value="system">System</option>
                    <option value="rounded">Rounded</option>
                    <option value="mono">Mono</option>
                    <option value="serif">Serif</option>
                  </select>
                </div>
                <div class="setting-row">
                  <label for="opt-font-size">Base size <span id="val-font-size" class="val"></span></label>
                  <input id="opt-font-size" type="range" min="11" max="17" step="1">
                </div>
              </section>

              <section class="setting-group" data-section="layout" hidden>
                <h1 class="setting-title">Layout</h1>
                <p class="setting-note">Adjust the structural dimensions of the shell.</p>
                <div class="setting-row">
                  <label for="opt-sidebar-w">Sidebar width <span id="val-sidebar-w" class="val"></span></label>
                  <input id="opt-sidebar-w" type="range" min="180" max="360" step="2">
                </div>
                <div class="setting-row">
                  <label for="opt-rail-w">Rail width <span id="val-rail-w" class="val"></span></label>
                  <input id="opt-rail-w" type="range" min="40" max="80" step="2">
                </div>
                <div class="setting-row">
                  <label for="opt-topbar-h">Top bar height <span id="val-topbar-h" class="val"></span></label>
                  <input id="opt-topbar-h" type="range" min="40" max="72" step="2">
                </div>
                <div class="setting-row">
                  <label for="opt-radius">Corner radius <span id="val-radius" class="val"></span></label>
                  <input id="opt-radius" type="range" min="0" max="22" step="1">
                </div>
              </section>

              <footer class="settings-foot">
                <button id="theme-reset" class="btn" type="button">Reset to defaults</button>
              </footer>
            </div>
          </section>
        </main>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
